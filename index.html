<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>djkurtz Arcade</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #38bdf8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 40px; color: var(--accent); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }
        .game-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #334155;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border-color: var(--accent);
        }
        .preview {
            width: 100%;
            height: 150px;
            background: #334155;
            object-fit: cover;
        }
        .info { padding: 15px; text-align: center; }
        .info h2 { margin: 0; font-size: 1.25rem; }
    </style>
</head>
<body>

    <h1>🎮 Games</h1>

    <div class="grid">
        <!-- Repeat this block for each game directory -->
        <a href="dansteroids/" class="game-card">
            <img src="dansteroids/preview.png" alt="Dansteroids" class="preview">
            <div class="info">
                <h2>Dansteroids</h2>
            </div>
        </a>

        <a href="dantris/" class="game-card">
            <img src="dantris/preview.png" alt="Dantris" class="preview">
            <div class="info">
                <h2>Dantris</h2>
            </div>
        </a>

        <a href="life/" class="game-card">
            <img src="life/preview.png" alt="Life" class="preview">
            <div class="info">
                <h2>Conway's Game of Life</h2>
            </div>
        </a>

        <a href="maze/" class="game-card">
            <img src="maze/preview.png" alt="Maze" class="preview">
            <div class="info">
                <h2>Maze</h2>
            </div>
        </a>
    </div>

    <h1>🎮 Demos</h1>

    <div class="grid">
        <a href="gravity/" class="game-card">
            <img src="gravity/preview.png" alt="Gravity" class="preview">
            <div class="info">
                <h2>Gravity</h2>
            </div>
        </a>
    </div>

</body>
</html>
